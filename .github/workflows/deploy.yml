name: Deploy Projects

permissions:
  contents: read

on:
  push:
    branches:
      - master
    paths:
      - 'Discord-Bot-WebUI/**'   # Watch for changes in the Web UI folder
      - '**'                     # Watch for changes in the bot files

  workflow_dispatch:

jobs:
  # Web UI Deployment
  web_ui_deploy:
    if: contains(github.event.head_commit.message, 'web-ui') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up SSH for Deployment
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Build and Restart Web UI Service
        run: |
          ssh -o StrictHostKeyChecking=no deployer@${{ secrets.SERVER_IP }} '
            cd /home/deployer/ecs-web/ECS-Discord-Bot &&
            git pull origin master &&
            mkdir -p maintenance/data &&
            echo "{\"start\":$(date +%s)000}" > maintenance/data/deploy_time.json &&
            # --force-recreate is REQUIRED: the source is bind-mounted, so nothing in the
            # compose config changes between deploys and a plain `up -d` treats the
            # containers as current and does nothing at all -- the job would report
            # success having deployed no code. Recreating re-runs the container's
            # `npm run build`, which is what actually publishes new front-end assets.
            # NOTE: a package.json change ALSO needs `npm install` in the container
            # first -- node_modules sits under the bind-mounted /app, so the image's
            # own copy is masked at runtime.
            docker-compose up -d --force-recreate webui celery-worker celery-beat
          '

  # Discord Bot Deployment
  bot_deploy:
    if: contains(github.event.head_commit.message, 'bot') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up SSH for Deployment
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Build and Restart Discord Bot Service
        run: |
          ssh -o StrictHostKeyChecking=no deployer@${{ secrets.SERVER_IP }} '
            cd /home/deployer/ecs-web/ECS-Discord-Bot &&
            git pull origin master &&  # Ensure the latest code is pulled
            docker-compose build discord-bot &&
            docker-compose up -d discord-bot
          '