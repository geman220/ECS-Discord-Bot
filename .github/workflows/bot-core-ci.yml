name: Bot Core CI

permissions:
  contents: read

on:
  pull_request:
    branches: [ master ]
    paths:
      - '*.py'
      - 'api/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/bot-core-ci.yml'
  push:
    branches: [ master ]
    paths:
      - '*.py'
      - 'api/**'
      - 'tests/**'
      - 'requirements.txt'

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.9
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-mock pytest-cov aiohttp discord.py

    - name: Run Bot Core Unit Tests
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        python3 -m pytest tests/ -v --cov=. --cov-report=xml
      env:
        SERVER_ID: "123456789"
        BOT_TOKEN: "dummy_token"
        ADMIN_ROLE: "Admin"
        DEV_ID: "987654321"
        TEAM_ID: "184"
        URL: "https://example.com/wp-json/wc/v3/orders/"
        MATCH_CHANNEL_ID: "111222333"
        LEAGUE_ANNOUNCEMENTS_CHANNEL_ID: "444555666"
        WC_KEY: "dummy_wc_key"
        WC_SECRET: "dummy_wc_secret"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        file: ./coverage.xml
        flags: botcore
        name: bot-core-check
        fail_ci_if_error: false

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy
    
    - name: Run Black (Formatting)
      run: black --check --diff .
      continue-on-error: true # Report only for now
    
    - name: Run isort (Imports)
      run: isort --check-only --diff .
      continue-on-error: true
    
    - name: Run flake8 (Linting)
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - name: Run mypy (Type Checking)
      run: mypy . --ignore-missing-imports
      continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
    
    # --severity-level high: this job had never run (its trigger listed branches
    # main/develop, which do not exist here), so its first execution surfaced ~90
    # pre-existing LOW/MEDIUM findings -- B311 random in non-crypto paths, B104
    # bind-all inside containers, B110 try/except/pass. Blocking every bot change on
    # those helps nobody. HIGH still fails the build; the two that existed
    # (subprocess shell=True in start_rest_api) are fixed.
    - name: Run bandit (Security Linting)
      run: bandit -r . -x ./tests,./Discord-Bot-WebUI -f custom --severity-level high
    
    - name: Run safety (Vulnerability Scan)
      run: safety check
      continue-on-error: true

  # The "Secrets Detection" job was removed: it used `trl/secret-scanner@v1`, an action
  # that does not exist ("Unable to resolve action ... repository not found"), so it could
  # never have run. It went unnoticed because this whole workflow was mis-triggered on
  # branches main/develop. GitHub native secret scanning + push protection covers the
  # repo already; if a workflow-level scanner is wanted, add a real one deliberately
  # (gitleaks or trufflehog) rather than restoring a broken reference.
