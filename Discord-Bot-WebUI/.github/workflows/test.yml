name: Tests

permissions:
  contents: read

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# A second push supersedes the first: cancel the in-flight run instead of paying
# for two full suites. Never cancels on master/main, so the branch always ends up
# with a real result for its final commit.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

env:
  PYTHONDONTWRITEBYTECODE: 1
  PYTHONUNBUFFERED: 1
  # Test environment variables
  TESTING: true
  SECRET_KEY: test-secret-key-for-ci
  JWT_SECRET_KEY: test-jwt-secret-for-ci
  REDIS_URL: redis://localhost:6379/0

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # PostgreSQL service - matches production database
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis service
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Database connection for PostgreSQL
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      # ONE run, with coverage, and it gates.
      #
      # This used to be two steps that each ran the whole suite: a gating run
      # with `-x --maxfail=10`, then a second full run for coverage marked
      # `continue-on-error: true`. That doubled CI time (~2min -> ~4min) and the
      # output people actually read was the SECOND one -- the one that could not
      # fail the build. Anything learned from it was advisory by accident.
      #
      # `-x`/`--maxfail` are gone on purpose: a contributor should see every
      # failure in one run, not fix ten and discover the next ten on the
      # following push.
      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        run: |
          pytest tests/ -v --tb=short --no-header \
            --ignore=archived_tests \
            --ignore=tests/mobile \
            --cov=app --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=20

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting tools
        run: |
          pip install flake8

      # These four selects are NOT style: they are "this code cannot run".
      #   E9  - syntax / indentation errors
      #   F63 - comparisons that are always the same value
      #   F7  - syntax misuse (e.g. `break` outside a loop)
      #   F82 - UNDEFINED NAME
      #
      # F82 is worth calling out. Undefined-name and local-shadowing mistakes
      # were the single most common real bug found in this codebase recently --
      # a function-local `from app.models import Match` made `Match` local to the
      # WHOLE function, so an earlier use raised UnboundLocalError and an endpoint
      # returned 500 on every call. Six more sites had the same shape.
      #
      # TODO(maintainer): flip this to gating by deleting `continue-on-error`.
      # It is left advisory ONLY because nobody has yet confirmed app/ is clean
      # under these selects, and turning it on while a pre-existing hit remains
      # would block every PR. Verify locally first:
      #     flake8 app/ --count --select=E9,F63,F7,F82
      # If that prints 0, delete the continue-on-error line below. If it prints
      # anything, those are real bugs -- fix them, then gate.
      - name: Run flake8 (syntax errors and undefined names)
        run: |
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true
