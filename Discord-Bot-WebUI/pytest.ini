[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Ignore archived tests and other non-test directories
norecursedirs =
    archived_tests
    __pycache__
    .git
    node_modules
    app
    migrations

# Default options (coverage is run separately in CI)
addopts =
    --strict-markers
    -p no:postgresql
    -v
    --ignore=archived_tests
    # Ignore the CSS analysis suite (needs cssutils and reads the built CSS),
    # NOT the whole tests/mobile package. Ignoring the directory also excluded
    # the mobile API CONTRACT tests, so the endpoint shapes the Flutter app is
    # coded against were verified by nobody on a normal `pytest` run.
    --ignore=tests/mobile/test_css_conflicts.py

# Custom markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (database, external services)
    slow: Slow running tests
    api: API endpoint tests
    celery: Celery task tests
    auth: Authentication tests
    smoke: Critical path tests
    contract: API contract tests
    e2e: End-to-end tests
    performance: Performance benchmark tests

# Ignore warnings from libraries
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::sqlalchemy.exc.SADeprecationWarning

# Async support
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Timeout for tests (seconds)
timeout = 300

# NOTE: the `env =` block that used to live here required the pytest-env
# plugin, which is NOT in requirements-test.txt -- so it was silently ignored
# (and became a warning the moment this file's section header was corrected
# from [tool:pytest] to [pytest]).
#
# It is removed rather than "fixed" because nothing needs it: conftest.py
# builds the app with TESTING=True and an in-memory SQLite database, and the CI
# workflow exports DATABASE_URL / REDIS_URL / SECRET_KEY / JWT_SECRET_KEY on
# each pytest step. Re-adding it would ALSO have pointed tests at a Postgres
# URL that conftest never uses, which is misleading.